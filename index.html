<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mines Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1c1e24;
      --tile-bg: #2a2d37;
      --accent-color: #00e701;
      --danger-color: #e9113c;
      --text-main: #ffffff;
      --text-muted: #8b8f9a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .header {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .balance-box {
      font-size: 14px;
      color: var(--text-muted);
    }

    .balance-val {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      margin-bottom: 16px;
    }

    .tile {
      background-color: var(--tile-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.revealed-gem {
      background-color: rgba(0, 231, 1, 0.15);
      border: 1px solid var(--accent-color);
    }

    .tile.revealed-bomb {
      background-color: rgba(233, 17, 60, 0.2);
      border: 1px solid var(--danger-color);
    }

    .tile.disabled {
      pointer-events: none;
      opacity: 0.6;
    }

    .controls {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    input, select {
      background: var(--tile-bg);
      border: 1px solid #3c404d;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      width: 120px;
      text-align: right;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-play {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-cashout {
      background-color: #ffd000;
      color: #000;
      display: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="balance-box">Баланс:</div>
    <div class="balance-val" id="balance">1000 🪙</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <div class="input-row">
      <span>Сумма ставки:</span>
      <input type="number" id="betAmount" value="10" min="1" step="5">
    </div>

    <div class="input-row">
      <span>Количество мин:</span>
      <select id="minesCount"></select>
    </div>

    <button id="btnStart" class="btn btn-play" onclick="startGame()">Начать игру</button>
    <button id="btnCashout" class="btn btn-cashout" onclick="cashOut()">Забрать (x1.00)</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) tg.expand();

    const TOTAL_TILES = 25;
    const HOUSE_EDGE = 0.03;
    let balance = 1000;
    let bet = 10;
    let minesCount = 3;
    let isPlaying = false;
    let mineIndices = new Set();
    let gemsFound = 0;

    const selectMines = document.getElementById('minesCount');
    for (let i = 1; i <= 24; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = i;
      if (i === 3) opt.selected = true;
      selectMines.appendChild(opt);
    }

    const gridEl = document.getElementById('grid');
    function initGrid() {
      gridEl.innerHTML = '';
      for (let i = 0; i < TOTAL_TILES; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile disabled';
        tile.id = `tile-${i}`;
        tile.onclick = () => handleTileClick(i);
        gridEl.appendChild(tile);
      }
    }
    initGrid();

    function combinations(n, k) {
      if (k < 0 || k > n) return 0;
      if (k === 0 || k === n) return 1;
      if (k > n / 2) k = n - k;
      let res = 1;
      for (let i = 1; i <= k; i++) {
        res = res * (n - i + 1) / i;
      }
      return res;
    }

    function calculateMultiplier(mines, diamonds) {
      if (diamonds === 0) return 1.0;
      const prob = combinations(TOTAL_TILES - mines, diamonds) / combinations(TOTAL_TILES, diamonds);
      const rawMultiplier = (1 - HOUSE_EDGE) / prob;
      return Math.max(1.01, parseFloat(rawMultiplier.toFixed(2)));
    }

    function haptic(type) {
      if (tg && tg.HapticFeedback) {
        if (type === 'hit') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'win') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'lose') tg.HapticFeedback.notificationOccurred('error');
      }
    }

    function startGame() {
      bet = parseInt(document.getElementById('betAmount').value, 10);
      minesCount = parseInt(document.getElementById('minesCount').value, 10);

      if (isNaN(bet) || bet <= 0 || bet > balance) {
        alert('Недостаточно монет или неверная ставка!');
        return;
      }

      balance -= bet;
      updateUI();

      mineIndices.clear();
      while (mineIndices.size < minesCount) {
        const randIndex = Math.floor(Math.random() * TOTAL_TILES);
        mineIndices.add(randIndex);
      }

      isPlaying = true;
      gemsFound = 0;

      for (let i = 0; i < TOTAL_TILES; i++) {
        const tile = document.getElementById(`tile-${i}`);
        tile.className = 'tile';
        tile.innerText = '';
      }

      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnCashout').style.display = 'block';
      updateCashoutButton();

      document.getElementById('betAmount').disabled = true;
      document.getElementById('minesCount').disabled = true;

      haptic('hit');
    }

    function updateCashoutButton() {
      const mult = calculateMultiplier(minesCount, gemsFound);
      const profit = Math.floor(bet * mult);
      const btn = document.getElementById('btnCashout');
      btn.innerText = `Забрать ${profit} 🪙 (x${mult})`;
      btn.disabled = (gemsFound === 0);
    }

    function handleTileClick(index) {
      if (!isPlaying) return;

      const tile = document.getElementById(`tile-${index}`);
      if (tile.classList.contains('revealed-gem')) return;

      if (mineIndices.has(index)) {
        tile.classList.add('revealed-bomb');
        tile.innerText = '💣';
        haptic('lose');
        endGame(false);
      } else {
        tile.classList.add('revealed-gem');
        tile.innerText = '💎';
        gemsFound++;
        haptic('hit');

        if (gemsFound === (TOTAL_TILES - minesCount)) {
          cashOut();
        } else {
          updateCashoutButton();
        }
      }
    }

    function cashOut() {
      if (!isPlaying || gemsFound === 0) return;
      const mult = calculateMultiplier(minesCount, gemsFound);
      const winAmount = Math.floor(bet * mult);
      balance += winAmount;

      haptic('win');
      endGame(true, winAmount);
    }

    function endGame(isWin, winAmount = 0) {
      isPlaying = false;

      mineIndices.forEach(idx => {
        const tile = document.getElementById(`tile-${idx}`);
        if (!tile.classList.contains('revealed-bomb')) {
          tile.innerText = '💣';
          tile.classList.add('revealed-bomb');
        }
      });

      for (let i = 0; i < TOTAL_TILES; i++) {
        document.getElementById(`tile-${i}`).classList.add('disabled');
      }

      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnCashout').style.display = 'none';
      document.getElementById('betAmount').disabled = false;
      document.getElementById('minesCount').disabled = false;

      updateUI();
    }

    function updateUI() {
      document.getElementById('balance').innerText = `${balance} 🪙`;
    }
  </script>
</body>
</html>
