<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Telegram Arcade</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1c1e24;
      --tile-bg: #2a2d37;
      --accent-color: #00e701;
      --danger-color: #e9113c;
      --text-main: #ffffff;
      --text-muted: #8b8f9a;
    }

    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .hidden { display: none !important; }

    /* Шапка с балансом */
    .header {
      width: 100%; max-width: 360px;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 12px 16px; border-radius: 12px; margin-bottom: 16px;
    }
    .balance-val { font-size: 18px; font-weight: bold; color: var(--accent-color); }

    /* Главное меню */
    .menu-container { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .game-card {
      background: var(--card-bg); padding: 16px; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; border: 1px solid #3c404d; transition: 0.2s;
    }
    .game-card:active { transform: scale(0.98); }
    .game-info h3 { font-size: 16px; margin-bottom: 4px; }
    .game-info p { font-size: 12px; color: var(--text-muted); }

    /* Общие элементы игр */
    .game-screen { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
    .back-btn { background: #3c404d; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; align-self: flex-start; font-size: 14px; }

    /* Стили для Сапера */
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; aspect-ratio: 1; }
    .tile { background-color: var(--tile-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
    .tile.revealed-gem { background-color: rgba(0, 231, 1, 0.15); border: 1px solid var(--accent-color); }
    .tile.revealed-bomb { background-color: rgba(233, 17, 60, 0.2); border: 1px solid var(--danger-color); }
    .tile.disabled { pointer-events: none; opacity: 0.6; }

    /* Стили для Ракетки (Crash) */
    .crash-board {
      background: var(--tile-bg); border-radius: 12px; height: 220px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .multiplier { font-size: 36px; font-weight: bold; color: var(--accent-color); }
    .rocket { font-size: 40px; transition: transform 0.1s; }

    .controls { background: var(--card-bg); padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    input, select { background: var(--tile-bg); border: 1px solid #3c404d; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 15px; outline: none; width: 120px; text-align: right; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
    .btn-play { background-color: var(--accent-color); color: #000; }
    .btn-cashout { background-color: #ffd000; color: #000; display: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <div>Баланс:</div>
    <div class="balance-val" id="balance">1000 🪙</div>
  </div>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="mainMenu" class="menu-container">
    <h2 style="margin-bottom: 4px;">Выбор игры 🎮</h2>
    <div class="game-card" onclick="openGame('mines')">
      <div class="game-info">
        <h3>💣 Сапер (Mines)</h3>
        <p>Ищите кристаллы и избегайте бомбы</p>
      </div>
      <span>➔</span>
    </div>
    <div class="game-card" onclick="openGame('crash')">
      <div class="game-info">
        <h3>🚀 Ракета (Crash)</h3>
        <p>Успейте забрать выигрыш до взлета ракеты</p>
      </div>
      <span>➔</span>
    </div>
  </div>

  <!-- ИГРА: САПЕР -->
  <div id="minesGame" class="game-screen hidden">
    <button class="back-btn" onclick="goToMenu()">← Назад в меню</button>
    <div class="grid" id="grid"></div>
    <div class="controls">
      <div class="input-row"><span>Ставка:</span><input type="number" id="betMines" value="10" min="1"></div>
      <div class="input-row"><span>Мины:</span><select id="minesCount"></select></div>
      <button id="btnStartMines" class="btn btn-play" onclick="startMines()">Играть</button>
      <button id="btnCashoutMines" class="btn btn-cashout" onclick="cashOutMines()">Забрать</button>
    </div>
  </div>

  <!-- ИГРА: РАКЕТКА -->
  <div id="crashGame" class="game-screen hidden">
    <button class="back-btn" onclick="goToMenu()">← Назад в меню</button>
    <div class="crash-board">
      <div class="rocket" id="rocketIcon">🚀</div>
      <div class="multiplier" id="crashMult">1.00x</div>
    </div>
    <div class="controls">
      <div class="input-row"><span>Ставка:</span><input type="number" id="betCrash" value="10" min="1"></div>
      <button id="btnStartCrash" class="btn btn-play" onclick="startCrash()">Запустить ракету</button>
      <button id="btnCashoutCrash" class="btn btn-cashout" onclick="cashOutCrash()">Забрать выигрыш</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) tg.expand();

    let balance = 1000;
    function updateUI() { document.getElementById('balance').innerText = `${balance} 🪙`; }

    function goToMenu() {
      document.getElementById('mainMenu').classList.remove('hidden');
      document.getElementById('minesGame').classList.add('hidden');
      document.getElementById('crashGame').classList.add('hidden');
      if (crashInterval) clearInterval(crashInterval);
    }

    function openGame(type) {
      document.getElementById('mainMenu').classList.add('hidden');
      if (type === 'mines') {
        document.getElementById('minesGame').classList.remove('hidden');
      } else if (type === 'crash') {
        document.getElementById('crashGame').classList.remove('hidden');
      }
    }

    // --- ЛОГИКА САПЕРА ---
    const TOTAL_TILES = 25;
    let mineIndices = new Set(), gemsFound = 0, isMinesPlaying = false, minesBet = 10;
    const selectMines = document.getElementById('minesCount');
    for (let i = 1; i <= 24; i++) {
      let opt = document.createElement('option'); opt.value = i; opt.innerText = i;
      if (i === 3) opt.selected = true;
      selectMines.appendChild(opt);
    }
    const gridEl = document.getElementById('grid');
    for (let i = 0; i < TOTAL_TILES; i++) {
      let tile = document.createElement('div');
      tile.className = 'tile disabled';
      tile.id = `tile-${i}`;
      tile.onclick = () => clickTile(i);
      gridEl.appendChild(tile);
    }

    function startMines() {
      minesBet = parseInt(document.getElementById('betMines').value);
      let count = parseInt(selectMines.value);
      if (minesBet > balance || isNaN(minesBet)) return alert('Ошибка ставки');
      balance -= minesBet; updateUI();
      mineIndices.clear();
      while(mineIndices.size < count) mineIndices.add(Math.floor(Math.random() * TOTAL_TILES));
      isMinesPlaying = true; gemsFound = 0;
      for (let i = 0; i < TOTAL_TILES; i++) {
        let t = document.getElementById(`tile-${i}`);
        t.className = 'tile'; t.innerText = '';
      }
      document.getElementById('btnStartMines').style.display = 'none';
      document.getElementById('btnCashoutMines').style.display = 'block';
    }

    function clickTile(i) {
      if (!isMinesPlaying) return;
      let t = document.getElementById(`tile-${i}`);
      if (t.classList.contains('revealed-gem')) return;
      if (mineIndices.has(i)) {
        t.classList.add('revealed-bomb'); t.innerText = '💣';
        isMinesPlaying = false;
        document.getElementById('btnStartMines').style.display = 'block';
        document.getElementById('btnCashoutMines').style.display = 'none';
      } else {
        t.classList.add('revealed-gem'); t.innerText = '💎';
        gemsFound++;
        let mult = (1 + gemsFound * 0.2).toFixed(2);
        document.getElementById('btnCashoutMines').innerText = `Забрать (${Math.floor(minesBet * mult)} 🪙)`;
      }
    }

    function cashOutMines() {
      if (!isMinesPlaying) return;
      let mult = (1 + gemsFound * 0.2);
      balance += Math.floor(minesBet * mult);
      updateUI();
      isMinesPlaying = false;
      document.getElementById('btnStartMines').style.display = 'block';
      document.getElementById('btnCashoutMines').style.display = 'none';
    }

    // --- ЛОГИКА РАКЕТКИ (CRASH) ---
    let crashInterval = null, currentMult = 1.0, crashPoint = 1.0, isCrashPlaying = false, crashBet = 10;

    function startCrash() {
      crashBet = parseInt(document.getElementById('betCrash').value);
      if (crashBet > balance || isNaN(crashBet)) return alert('Ошибка ставки');
      balance -= crashBet; updateUI();

      isCrashPlaying = true;
      currentMult = 1.0;
      crashPoint = parseFloat((1.1 + Math.random() * 3.5).toFixed(2)); // Ракетный краш от 1.1x до 4.6x

      document.getElementById('btnStartCrash').style.display = 'none';
      document.getElementById('btnCashoutCrash').style.display = 'block';

      crashInterval = setInterval(() => {
        currentMult += 0.04;
        document.getElementById('crashMult').innerText = currentMult.toFixed(2) + 'x';
        let profit = Math.floor(crashBet * currentMult);
        document.getElementById('btnCashoutCrash').innerText = `Забрать ${profit} 🪙`;

        if (currentMult >= crashPoint) {
          // Краш!
          clearInterval(crashInterval);
          isCrashPlaying = false;
          document.getElementById('crashMult').innerText = '💥 CRASH';
          document.getElementById('btnStartCrash').style.display = 'block';
          document.getElementById('btnCashoutCrash').style.display = 'none';
        }
      }, 100);
    }

    function cashOutCrash() {
      if (!isCrashPlaying) return;
      clearInterval(crashInterval);
      isCrashPlaying = false;
      let win = Math.floor(crashBet * currentMult);
      balance += win;
      updateUI();
      document.getElementById('btnStartCrash').style.display = 'block';
      document.getElementById('btnCashoutCrash').style.display = 'none';
      alert(`Вы выиграли ${win} 🪙!`);
    }
  </script>
</body>
    </html>
